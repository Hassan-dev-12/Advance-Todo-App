<!DOCTYPE html>
<html lang="ur">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Boss Todo App</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>Boss Todo App 🔥</h1>
    
    <!-- سرچ والا نیا فیچر -->
    <input type="text" id="searchInput" placeholder="🔍 Search karo boss..." style="width:100%; padding:10px; margin-bottom:12px; border-radius:8px; border:1px solid #ccc;">

    <div class="input-box">
      <input type="text" id="taskInput" placeholder="نیا ٹاسک لکھیں... youtube.com جیسا">
      <button id="addBtn">Add</button>
    </div>

    <ul id="taskList"></ul>

    <button id="modeBtn" style="margin-top:15px;">Dark / Light</button>
  </div>

  <script src="app.js"></script>
</body>
</html>
